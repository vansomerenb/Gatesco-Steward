<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="houstonTitle houstonDesc">
  <title id="houstonTitle">Greater Houston service area</title>
  <desc id="houstonDesc">Stylized map emphasizing the Greater Houston metropolitan area where Gatesco Steward Partners offers property management, maintenance, and construction renovation services.</desc>
  <defs>
    <radialGradient id="metroGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#b8954a" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#b8954a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f6f4ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0c1a2b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    .ring { fill: none; stroke: #d9d4c8; stroke-width: 2; }
    .ring--inner { stroke: #b8954a; stroke-width: 2.5; stroke-dasharray: 8 6; opacity: 0.7; }
    .road { stroke: #c8c2b4; stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
    .label-main { font: 700 42px 'Source Sans 3', system-ui, sans-serif; fill: #0c1a2b; }
    .label-sub { font: 600 18px 'Source Sans 3', system-ui, sans-serif; fill: #4a5f73; letter-spacing: 0.06em; }
    .pin-label { font: 700 22px 'Source Sans 3', system-ui, sans-serif; fill: #0c1a2b; }
    .legend-title { font: 700 15px 'Source Sans 3', system-ui, sans-serif; fill: #0c1a2b; }
    .legend-sub { font: 400 13px 'Source Sans 3', system-ui, sans-serif; fill: #4a5f73; }
  </style>
  <rect width="100%" height="100%" fill="#f6f4ef"/>
  <ellipse cx="600" cy="330" rx="420" ry="280" fill="url(#metroGlow)"/>
  <circle class="ring" cx="600" cy="330" r="248"/>
  <circle class="ring--inner" cx="600" cy="330" r="168"/>
  <path class="road" d="M 120 330 H 1080"/>
  <path class="road" d="M 600 80 V 580"/>
  <path class="road" d="M 280 180 L 920 480"/>
  <path class="road" d="M 920 180 L 280 480"/>
  <g filter="url(#pinShadow)">
    <circle cx="600" cy="330" r="28" fill="#b8954a" stroke="#0c1a2b" stroke-width="2"/>
    <circle cx="600" cy="330" r="10" fill="#f6f4ef"/>
  </g>
  <text x="600" y="392" text-anchor="middle" class="pin-label">Houston</text>
  <text x="600" y="118" text-anchor="middle" class="label-main">Greater Houston</text>
  <text x="600" y="152" text-anchor="middle" class="label-sub">PROPERTY MANAGEMENT · UNIT TURNS · BUILDING REHAB</text>
  <g>
    <rect x="40" y="592" width="320" height="56" rx="4" fill="#ffffff" stroke="#d9d4c8"/>
    <rect x="56" y="610" width="18" height="18" rx="2" fill="#b8954a" stroke="#0c1a2b" stroke-width="0.5"/>
    <text x="82" y="624" class="legend-title">Greater Houston — units on platform</text>
    <text x="82" y="642" class="legend-sub">Class B &amp; C garden-style multifamily</text>
  </g>
</svg>